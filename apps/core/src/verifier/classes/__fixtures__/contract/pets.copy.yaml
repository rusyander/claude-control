openapi: 3.0.3
info:
  title: Pets API
  version: 1.1.0
paths:
  /pets:
    get:
      summary: List all pets
      parameters:
        - name: tag
          in: query
          schema:
            type: string
        - name: limit
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, owner]
              properties:
                name: { type: string }
                owner: { type: string }
      responses:
        '201':
          description: created
  /owners:
    get:
      responses:
        '200':
          description: ok
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [available, sold, pending]
        age:
          type: integer
      description: |
        A pet, changed text.
