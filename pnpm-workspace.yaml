packages:
  - 'apps/*'
  - 'packages/*'
  # Мобильное приложение живёт на npm со своим node_modules: Metro не дружит с
  # изолированными симлинками pnpm, а менять линковку всему репозиторию ради
  # одного пакета дороже, чем держать его вне воркспейса. Типы контрактов оно
  # тянет из исходников (`packages/contracts/src`) — расходиться им не с чего.
  - '!apps/mobile'
