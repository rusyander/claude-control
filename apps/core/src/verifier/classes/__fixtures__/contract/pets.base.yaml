openapi: 3.0.3
info:
  title: Pets
  version: 1.0.0
paths:
  /pets:
    get:
      summary: List pets # комментарий не попадает в разбор
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                nick: { type: string }
      responses:
        '201':
          description: created
  /pets/{id}:
    delete:
      responses:
        '204':
          description: gone
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [available, sold]
      description: |
        A pet.
        Two lines.
